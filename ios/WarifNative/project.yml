# XcodeGen project spec for Warif Native (iOS).
# Generate the Xcode project with:  xcodegen generate
name: WarifNative
options:
  bundleIdPrefix: sa.warif
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_BUNDLE_IDENTIFIER: $(WARIF_BUNDLE_ID)
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1"

# Public config only (URL + publishable key + bundle id). The real file
# Configuration/Secrets.xcconfig is git-ignored; copy it from the example.
configFiles:
  Debug: Configuration/Secrets.xcconfig
  Release: Configuration/Secrets.xcconfig

targets:
  WarifNative:
    type: application
    platform: iOS
    sources:
      - path: WarifNative
    dependencies:
      - target: WarifWatch
        embed: true
    settings:
      base:
        INFOPLIST_FILE: WarifNative/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: WarifNative/WarifNative.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: NO

  WarifWatch:
    type: application
    platform: watchOS
    sources:
      - path: WarifWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WARIF_BUNDLE_ID).watchkitapp
        WATCHOS_DEPLOYMENT_TARGET: "11.0"
        CODE_SIGN_ENTITLEMENTS: WarifWatch/WarifWatch.entitlements
        CODE_SIGNING_ALLOWED: NO

  WarifNativeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WarifNativeTests
    dependencies:
      - target: WarifNative

  WarifNativeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: WarifNativeUITests
    dependencies:
      - target: WarifNative

schemes:
  WarifNative:
    build:
      targets:
        WarifNative: all
        WarifWatch: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WarifNativeTests
        - WarifNativeUITests
