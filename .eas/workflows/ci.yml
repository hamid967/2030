name: CI

# Runs the web app's quality gate (lint, typecheck, unit tests, build).
# Warif is currently a Next.js PWA (no native Expo build yet), so this is a
# custom job — it does not use a `build`/`submit`/`update` pre-packaged job.
# Any run can also be triggered manually from the EAS dashboard or with
# `eas workflow:run .eas/workflows/ci.yml`, regardless of the `on` triggers.

on:
  push:
    branches:
      - main
  pull_request: {}

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs_on: linux-medium
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
