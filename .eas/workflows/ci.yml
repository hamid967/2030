name: Manual EAS quality check

# Warif is now a Next.js PWA plus a native SwiftUI iOS project. GitHub Actions
# owns the automatic quality gate in .github/workflows/ci.yml. This EAS workflow
# stays available for manual Expo-dashboard checks only, so linked Expo projects
# do not publish failing required statuses for every push.

on:
  workflow_dispatch: {}

defaults:
  tools:
    node: 24

jobs:
  quality:
    name: Manual lint, typecheck, test, build
    runs_on: linux-medium
    steps:
      - uses: eas/checkout
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
