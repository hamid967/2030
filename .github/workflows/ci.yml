name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Debug repo state
        run: |
          echo "Working directory: $(pwd)"
          echo "Listing repo root:"
          ls -la
          echo "package.json present:" && [ -f package.json ] && echo yes || echo no
          echo "package-lock.json present:" && [ -f package-lock.json ] && echo yes || echo no
          echo "Node and npm versions:" && node -v && npm -v

      - name: Install dependencies (prefer lockfile)
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  ios:
    name: iOS project validation
    runs-on: macos-26
    defaults:
      run:
        working-directory: ios/WarifNative
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Create CI config
        run: cp Configuration/Secrets.example.xcconfig Configuration/Secrets.xcconfig
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build iOS app
        run: xcodebuild -scheme WarifNative -destination 'platform=iOS Simulator,name=iPhone 17' CODE_SIGNING_ALLOWED=NO build
      - name: Test iOS app
        run: xcodebuild test -scheme WarifNative -destination 'platform=iOS Simulator,name=iPhone 17' CODE_SIGNING_ALLOWED=NO
